---
- name: Install Python, pip and helper tools
  apt:
    name:
      - python3
      - python3-pip
      - wget
      - unzip
    state: present
    update_cache: yes

- name: Install Google Chrome
  apt:
    deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    state: present

- name: Install Selenium and test libraries
  pip:
    name:
      - selenium
      - pytest
      - pytest-html
    executable: pip3
